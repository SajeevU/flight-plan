name: CAAS API probe

# Manual check that the CAAS key works and what the live data looks like.
# Prints status codes, sizes and a small sample; the key itself is masked by Actions.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CAAS_API_KEY: ${{ secrets.CAAS_API_KEY }}
    steps:
      - name: Probe endpoints
        run: |
          if [ -z "$CAAS_API_KEY" ]; then echo "::error::CAAS_API_KEY secret is not set"; exit 1; fi
          set +e
          echo "DNS: $(getent hosts api.swimapisg.info)"
          probe() {
            rm -f body.json; touch body.json
            echo "=== $1"
            code=$(curl -sS -m 20 -o body.json -w '%{http_code}' -H "apikey: $CAAS_API_KEY" "$1" || echo 000)
            echo "status=$code bytes=$(wc -c < body.json 2>/dev/null || echo 0)"
            jq -r 'if type=="array" then "items=\(length)" else "type=\(type)" end' body.json 2>/dev/null || head -c 300 body.json; echo
          }
          for base in http://api.swimapisg.info:9080 https://api.swimapisg.info; do
            probe "$base/flightmanager/displayAll"
            probe "$base/flight-manager/displayAll"
            for t in airways fixes airports; do
              probe "$base/geopoints/list/$t"
              jq -c '.[0:3]' body.json 2>/dev/null || true
            done
          done
      - name: Sample live data shapes
        run: |
          set +e
          B=https://api.swimapisg.info
          get() { curl -sS -m 60 -H "apikey: $CAAS_API_KEY" "$B$1"; }
          get /flight-manager/displayAll > flights.json
          echo "--- one flight (route elements truncated)"
          jq '.[0] | .filedRoute.routeElement |= (.[0:5])' flights.json | head -c 6000; echo
          echo "--- field presence across all flights"
          jq -r '[.[] | {dep: (.departure.departureAerodrome|type), arr: (.arrival.destinationAerodrome|type), n: ((.filedRoute.routeElement // [])|length), withLatLon: ([.filedRoute.routeElement[]? | select(.position.lat != null)]|length), withAirway: ([.filedRoute.routeElement[]? | select(.airway != null)]|length)}] | group_by(.dep,.arr) | map({dep: .[0].dep, arr: .[0].arr, flights: length, avgElements: (map(.n)|add/length), elementsWithLatLon: (map(.withLatLon)|add), elementsWithAirway: (map(.withAirway)|add)})' flights.json
          echo "--- distinct callsign sample"; jq -r '[.[].aircraftIdentification] | .[0:15] | join(" ")' flights.json
          for q in /geopoints/search/airways/W218 /geopoints/search/airways/A464 /geopoints/search/fixes/VJR /geopoints/search/airports/WSSS /geopoints/exist/fixes/VJR; do
            echo "--- $q"; get "$q" | head -c 1500; echo
          done

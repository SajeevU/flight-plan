name: CAAS API probe

# Manual check that the CAAS key works and what the live data looks like.
# Prints status codes, sizes and a small sample; the key itself is masked by Actions.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CAAS_API_KEY: ${{ secrets.CAAS_API_KEY }}
    steps:
      - name: Probe endpoints
        run: |
          if [ -z "$CAAS_API_KEY" ]; then echo "::error::CAAS_API_KEY secret is not set"; exit 1; fi
          probe() {
            echo "=== $1"
            code=$(curl -sS -m 60 -o body.json -w '%{http_code}' -H "apikey: $CAAS_API_KEY" "$1" || echo 000)
            echo "status=$code bytes=$(wc -c < body.json 2>/dev/null || echo 0)"
            jq -r 'if type=="array" then "items=\(length)" else "type=\(type)" end' body.json 2>/dev/null || head -c 300 body.json
          }
          for base in http://api.swimapisg.info:9080 https://api.swimapisg.info; do
            probe "$base/flightmanager/displayAll"
            probe "$base/flight-manager/displayAll"
            for t in airways fixes airports; do
              probe "$base/geopoints/list/$t"
              jq -c '.[0:3]' body.json 2>/dev/null || true
            done
          done
      - name: Sample flight plan structure
        run: |
          curl -sS -m 60 -H "apikey: $CAAS_API_KEY" http://api.swimapisg.info:9080/flightmanager/displayAll -o flights.json || exit 0
          # Shape only: field names of one flight plus its route elements.
          jq '.[0] | {aircraftIdentification, departure, arrival, filedRoute: {routeElement: (.filedRoute.routeElement // [] | .[0:4])}}' flights.json || head -c 1000 flights.json
